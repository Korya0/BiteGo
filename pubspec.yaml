name: bite_go
description: "BiteGo - Food Delivery App"

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  # UI and Animation
  cupertino_icons: ^1.0.8
  flutter_animate: ^4.1.1
  google_fonts: ^6.2.1
  carousel_slider: ^5.0.0
  flutter_svg: ^2.0.10+1

  # Routing
  go_router: ^17.4.0

  # State Management & DI
  flutter_bloc: ^9.1.0
  get_it: ^8.0.2

  # Firebase
  firebase_core: ^3.6.0
  firebase_crashlytics: ^4.2.0
  firebase_analytics: ^11.6.0
  cloud_firestore: ^5.4.0
  firebase_auth: ^5.7.0
  google_sign_in: ^7.2.0

  # Local Storage
  hive_flutter: ^1.1.0

  # Utilities
  flutter_native_splash: ^2.4.7 # dart run flutter_native_splash:create
  device_preview: ^1.3.1
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/svgs/
    - assets/svgs/pre_auth/


flutter_native_splash:
  color: "#FFFFFF"
  image: assets/images/native_splash.png
  android: true
  ios: false
  web: false