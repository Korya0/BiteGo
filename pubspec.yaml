name: bite_go
description: "BiteGo - Food Delivery App"

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  go_router: ^17.4.0
  flutter_animate: ^4.1.1
  flutter_native_splash: ^2.4.7 # dart run flutter_native_splash:create
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/svgs/
    - assets/svgs/onboarding/
    - assets/svgs/indicators/

flutter_native_splash:
  color: "#FFFFFF"
  image: assets/images/native_splash.png
  android: true
  ios: false
  web: false